[tool.poetry]
name = "data-schema-evolution-tracker"
version = "0.1.0"
description = "Automated data contract enforcement and drift detection"
authors = ["Staff Engineer <eng@lab.internal>"]
packages = [{include = "data_schema_evolution_tracker", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.6.0"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
pandas = "^2.2.0"
numpy = "^1.26.0"
scipy = "^1.12.0"
jinja2 = "^3.1.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"